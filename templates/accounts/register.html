{% extends "base.html" %}
{% block title %}Регистрация арендатора{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 page-title">Регистрация арендатора</h1>
    <p class="text-secondary">ИНН и ОГРН проверяются по контрольным суммам. В рабочей системе здесь подключается проверка через API ФНС.</p>
    <div class="card"><div class="card-body p-4">
      <form method="post" novalidate>{% csrf_token %}
        {% include "_form_fields.html" %}
        <button class="btn btn-primary">Зарегистрироваться</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
