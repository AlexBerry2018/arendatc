name: arendatc

x-app-env: &app-env
  POSTGRES_DB: arendatc
  POSTGRES_USER: arendatc
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arendatc}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arendatc
      POSTGRES_USER: arendatc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arendatc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arendatc -d arendatc"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment: *app-env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo --if-empty &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    environment: *app-env
    command: sh -c "sleep 15 && python manage.py run_scheduler --interval 60"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
